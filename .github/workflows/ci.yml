name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: bun install

      - name: Verify toolchain versions
        run: |
          echo "tsc: $(node_modules/.bin/tsc --version)"
          node_modules/.bin/tsc --version | grep -q "^Version 7" || { echo "tsc must be TypeScript 7"; exit 1; }
          node -e "const v=require('typescript').version; console.log('typescript API:', v); if (!v.startsWith('6.')) process.exit(1)"

      - name: Build all packages
        run: bun run build:all

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Check package exports
        run: bun run check:packages

      - name: Check bundle size
        run: bun run size

      - name: Check generated docs
        run: bun run docs:check

      - name: Run tests
        run: bun run test

      - name: Check package versions
        run: |
          echo "Checking package versions..."
          cat packages/core/package.json | grep version
          cat packages/react/package.json | grep version
          cat packages/shared/package.json | grep version

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build:all

      - name: Install browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        run: bunx playwright test

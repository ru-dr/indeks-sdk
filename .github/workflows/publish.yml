name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.1.0)"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "packages/*/package.json"
    tags-ignore:
      - "**"

jobs:
  check-publish:
    runs-on: ubuntu-latest
    # Skip if commit is from github-actions bot
    if: github.actor != 'github-actions[bot]'
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check if should publish
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.head_commit.message }}" == *"[publish]"* ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract version from package.json
        id: extract
        run: |
          VERSION=$(cat packages/core/package.json | grep '"version"' | head -1 | awk -F: '{ print $2 }' | sed 's/[", ]//g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  publish:
    needs: check-publish
    if: needs.check-publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          scope: "@indeks"

      - name: Install dependencies
        run: bun install

      - name: Replace workspace protocol with actual versions
        run: |
          VERSION="${{ needs.check-publish.outputs.version }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          # Update core package.json to use actual version instead of workspace:*
          sed -i "s/\"@indeks\/shared\": \"workspace:\*\"/\"@indeks\/shared\": \"$VERSION\"/g" packages/core/package.json
          # Update react package.json to use actual versions instead of workspace:*
          sed -i "s/\"@indeks\/core\": \"workspace:\*\"/\"@indeks\/core\": \"$VERSION\"/g" packages/react/package.json
          sed -i "s/\"@indeks\/shared\": \"workspace:\*\"/\"@indeks\/shared\": \"$VERSION\"/g" packages/react/package.json

      - name: Validate package.json files
        run: |
          for pkg in shared core react; do
            echo "Validating packages/$pkg/package.json"
            node -e "JSON.parse(require('fs').readFileSync('packages/$pkg/package.json', 'utf8'))"
            
            # Check if README exists
            if [ ! -f "packages/$pkg/README.md" ]; then
              echo "ERROR: README.md missing in packages/$pkg"
              exit 1
            fi
            echo "README.md found in packages/$pkg"
          done

      - name: Verify no workspace protocol remains
        run: |
          if grep -n "workspace:" packages/*/package.json; then
            echo "ERROR: workspace: dependencies must be replaced before publishing"
            exit 1
          fi

      - name: Build all packages
        run: bun run build:all

      - name: Lint, typecheck and test
        run: |
          bun run lint
          bun run typecheck
          bun run test

      - name: Check package exports and size
        run: |
          bun run check:packages
          bun run size

      - name: Choose npm dist-tag
        id: dist_tag
        run: |
          VERSION="${{ needs.check-publish.outputs.version }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish @indeks/shared
        working-directory: ./packages/shared
        run: npm publish --provenance --access public --tag ${{ steps.dist_tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @indeks/core
        working-directory: ./packages/core
        run: npm publish --provenance --access public --tag ${{ steps.dist_tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @indeks/react
        working-directory: ./packages/react
        run: npm publish --provenance --access public --tag ${{ steps.dist_tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create and push git tag
        run: |
          VERSION="${{ needs.check-publish.outputs.version }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if tag already exists
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping tag creation"
          else
            git tag v$VERSION
            git push origin v$VERSION
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ needs.check-publish.outputs.version || github.event.inputs.version }}"
          tag_name: "v${{ needs.check-publish.outputs.version || github.event.inputs.version }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.dist_tag.outputs.prerelease }}
